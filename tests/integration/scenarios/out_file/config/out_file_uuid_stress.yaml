service:
  flush: 0.1
  grace: 2
  log_level: info
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    - name: dummy
      tag: app.a
      dummy: '{"proc":"${UUID_FILE_PROC}","input":"a","message":"hello uuid_file"}'
      rate: ${UUID_FILE_RATE}
      samples: ${UUID_FILE_SAMPLES}

    - name: dummy
      tag: app.b
      dummy: '{"proc":"${UUID_FILE_PROC}","input":"b","message":"hello uuid_file"}'
      rate: ${UUID_FILE_RATE}
      samples: ${UUID_FILE_SAMPLES}

  outputs:
    - name: file
      match: 'app.*'
      path: ${UUID_FILE_DIR}
      mkdir: on
      format: plain
      workers: 4
      uuid_file: on
      uuid_file_prefix: relay-
      retry_limit: no_limits
