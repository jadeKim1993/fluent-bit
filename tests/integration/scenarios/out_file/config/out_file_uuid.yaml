service:
  flush: 0.5
  grace: 1
  log_level: info
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    - name: dummy
      tag: app.log
      dummy: '{"proc":"${UUID_FILE_PROC}","message":"hello uuid_file"}'
      rate: 100
      samples: ${UUID_FILE_SAMPLES}

  outputs:
    - name: file
      match: '*'
      path: ${UUID_FILE_DIR}
      mkdir: on
      format: plain
      uuid_file: on
      uuid_file_prefix: relay-
      uuid_file_extension: .log
      uuid_file_tmp_max_age: 10m
